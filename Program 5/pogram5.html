<html>
<head>
<title>Registration Form</title>
<style>
div {
            text-align: center;
     }
 
textarea {
      height: 70px;
    }   
    
fieldset {
      padding: 15px;
      margin-bottom: 15px;
    }
    
form {
      padding:25px;  
    }
</style>
</head>
<body>

<form>
<fieldset>
<h1 align="center">REGISTRATION FORM</h1>
<fieldset><legend>User Information</legend>
<label for="name" >Name</label>
<select>
<option></option>
<option>Mr.</option>
<option>Mrs.</option>
<option>Miss.</option>
</select>
<input type="text" id ="name" required>

<br><br>

<label for="phone">Phone
<input type="tel" required></label>

<label>Email
<input type="email" required></label>

</fieldset>

<br><br>

<label for="address">Address</label>
<textarea id="address"required></textarea>

<br><br>

<label>Gender</label>
<label>Female</label>
<input type="radio" name="gender" required>
<label>Male</label>
<input type="radio" name="gender" required>
<label>Other</label>
<input type="radio" name="gender" required>


<br><br>

<label>Language Known</label>
<label>Malayalam</label>
<input type="checkbox" name="lang">
<label>English</label>
<input type="checkbox" name="lang">
<label>Hindi</label>
<input type="checkbox" name="lang">

<br><br>

<label for="course">Course</label>
<select>
<option></option>
<option>B.tech</option>
<option>MBA</option>
<option>MCA</option>
</select>

<br><br>

<div>
<input type="submit" value="Submit">
<input type="reset" value="Reset">
</div>

</fieldset>

</form>

</body>
</html>
